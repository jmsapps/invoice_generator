[project]
name = "invoice-generator"
version = "0.1.0"
description = "Generate client invoices as PDFs from per-client YAML configs"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "pydantic[email]>=2.9",
    "pyyaml>=6.0",
    "reportlab>=4.2",
]

[project.scripts]
invoice-generator = "invoice_generator.cli:main"

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_generator"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
